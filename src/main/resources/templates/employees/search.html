<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search employees</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:replace="~{fragments :: header}"></nav>

<h1>Search employees</h1>

<!-- method="get": the search conditions go into the URL, e.g. /employees/search?name=an&departmentId=1 -->
<form th:action="@{/employees/search}" method="get">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" th:value="${searchName}">

    <label for="departmentId">Department</label>
    <select id="departmentId" name="departmentId">
        <option value="">All departments</option>
        <!-- th:selected keeps the department chosen in the last search -->
        <option th:each="department : ${departments}" th:value="${department.id}" th:selected="${department.id == searchDepartmentId}" th:text="${department.name}">IT</option>
    </select>

    <button type="submit">Search</button>
</form>

<!-- Results are shown only after the form was submitted -->
<div th:if="${searched}">
    <h2>Results</h2>
    <p th:if="${#lists.isEmpty(employees)}">No employees found.</p>
    <div th:unless="${#lists.isEmpty(employees)}">
        <table th:replace="~{fragments :: employeeTable(${employees})}"></table>
    </div>
</div>
</body>
</html>
