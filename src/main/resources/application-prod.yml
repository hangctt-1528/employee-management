# Profile "prod": used by docker-compose.yml.
spring:
  datasource:
    # No default: the app must get the database from environment variables (docker-compose.yml).
    # A missing variable stops the app at startup.
    url: "${SPRING_DATASOURCE_URL}"
    username: "${SPRING_DATASOURCE_USERNAME}"
    password: "${SPRING_DATASOURCE_PASSWORD}"

server:
  servlet:
    session:
      cookie:
        # Secure: the browser sends the session cookie only over HTTPS. Set APP_COOKIE_SECURE=true
        # when the app runs behind HTTPS; with plain HTTP (docker compose) it must stay false or login breaks.
        # HttpOnly (JavaScript cannot read the cookie) is already Spring Boot's default.
        secure: "${APP_COOKIE_SECURE:false}"

app:
  security:
    # No defaults: set in docker-compose.yml
    admin-password: "${APP_ADMIN_PASSWORD}"
    user-password: "${APP_USER_PASSWORD}"
    jwt-secret: "${APP_JWT_SECRET}"

logging:
  level:
    com.example.employee_management: INFO
