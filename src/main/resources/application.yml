# Settings shared by every profile.
# The database and the log levels are in application-dev.yml and application-prod.yml.
spring:
  application:
    name: employee-management
  profiles:
    # Used only when no profile is set (./mvnw spring-boot:run); docker-compose.yml sets prod
    default: dev
  jpa:
    hibernate:
      # Create / update the tables from the @Entity classes ("validate" would fail on an empty database)
      ddl-auto: update
    # Close the database session when the service returns, not at the end of the HTTP request
    open-in-view: false
  cache:
    # In-memory cache (ConcurrentMap), no expiry; EmployeeCountCacheTask clears it every minute
    type: simple
    # Only this cache exists
    cache-names: employeeCount

management:
  endpoints:
    web:
      exposure:
        # Actuator endpoints open over HTTP (same port 8080). Never use "*": env and heapdump show secrets.
        # SecurityConfig: health is open, the others need ADMIN.
        include: health,metrics,caches,scheduledtasks
  endpoint:
    health:
      # Details only for ADMIN; others see {"status":"UP"}
      show-details: when-authorized
      roles: ADMIN

app:
  security:
    # JWT lifetime (1 hour)
    jwt-expiration-seconds: 3600
