spring.application.name=employee-management

# Database: values come from environment variables (set in docker-compose.yml),
# the part after ":" is the default for a local MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/employee_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:employee}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:employee}

# Create / update the tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Close the database session when the service returns, not at the end of the HTTP request
spring.jpa.open-in-view=false
