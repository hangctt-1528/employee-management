spring.application.name=employee-management

# Tests use an in-memory H2 database, so `mvnw test` does not need MySQL.
# This file replaces src/main/resources/application.properties during tests.
spring.datasource.url=jdbc:h2:mem:employee_db;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
