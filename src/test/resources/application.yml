# Tests use an in-memory H2 database, so `mvnw test` does not need MySQL.
# This file has the same name as src/main/resources/application.yml, so it replaces it during tests:
# no profile is active and application-dev.yml / application-prod.yml are not loaded.
spring:
  application:
    name: employee-management
  datasource:
    url: "jdbc:h2:mem:employee_db;MODE=MySQL;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
